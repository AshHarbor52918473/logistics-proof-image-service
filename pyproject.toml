[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logistics-proof-image-service"
version = "0.1.0"
description = "Compress proof-of-delivery images while recording shipment outcomes."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/logistics_image_service"]

